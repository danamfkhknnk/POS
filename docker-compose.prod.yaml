services:
  app:
    build: .
    container_name: pos_app
    restart: unless-stopped
    ports:
      - "8080:80"
      - "6001:6001"
    env_file: .env
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-myapp_db}
      - DB_USERNAME=${DB_USERNAME:-myuser}
      - DB_PASSWORD=${DB_PASSWORD:-mypassword}
      - QUEUE_CONNECTION=database
      - CACHE_STORE=database
      - SESSION_DRIVER=database
    volumes:
      - ./.env:/var/www/html/.env
      - app-storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  db:
    image: mysql:8.0
    container_name: pos_db
    restart: unless-stopped
    env_file: .env
    environment:
      - MYSQL_DATABASE=${DB_DATABASE:-myapp_db}
      - MYSQL_USER=${DB_USERNAME:-myuser}
      - MYSQL_PASSWORD=${DB_PASSWORD:-mypassword}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

volumes:
  db-data:
  app-storage:

networks:
  internal:
